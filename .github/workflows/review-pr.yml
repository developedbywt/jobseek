name: Codex PR Review & Fix

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

concurrency:
  group: review-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  MAX_REVIEW_ROUNDS: 2
  CODEX_MODEL: gpt-5.5-2026-04-23
  REVIEWER: Milky-Mac

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ vars.ENABLE_PR_REVIEW != 'false' && github.actor != 'github-actions[bot]' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo "::error::OPENAI_API_KEY is not set — skipping PR review."
            exit 1
          fi
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Resolve PR metadata
        id: pr_meta
        run: |
          PR="${{ github.event.pull_request.number || inputs.pr_number }}"
          DATA=$(gh api "repos/${{ github.repository }}/pulls/$PR")
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head_ref=$(echo "$DATA" | jq -r '.head.ref')" >> "$GITHUB_OUTPUT"
          echo "base_ref=$(echo "$DATA" | jq -r '.base.ref')" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ steps.pr_meta.outputs.head_ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Review, fix and approve loop
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr_meta.outputs.number }}
          PR_BRANCH: ${{ steps.pr_meta.outputs.head_ref }}
          BASE_BRANCH: ${{ steps.pr_meta.outputs.base_ref }}
          CODEX_MODEL: ${{ env.CODEX_MODEL }}
          MAX_REVIEW_ROUNDS: ${{ env.MAX_REVIEW_ROUNDS }}
          REVIEWER: ${{ env.REVIEWER }}
        run: |
          set -e

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Retry helper — for transient errors (network, rate limit) only
          retry() {
            local max=$1; shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [ "$attempt" -ge "$max" ] && return 1
              echo "Attempt $attempt failed — retrying in $((attempt * 30))s..."
              sleep $((attempt * 30))
            done
          }

          # On unexpected crash: auto-retry once via workflow_dispatch, then escalate to reviewer
          trap 'EXIT_CODE=$?; if [ "$EXIT_CODE" -ne 0 ]; then
            HAS_RETRY=$(gh pr view "$PR_NUMBER" --json labels --jq "[.labels[].name] | contains([\"review-auto-retry\"])" 2>/dev/null || echo "false")
            if [ "$HAS_RETRY" = "false" ]; then
              gh pr edit "$PR_NUMBER" --add-label "review-auto-retry" 2>/dev/null || \
                gh label create "review-auto-retry" --color "fbca04" --repo "$GITHUB_REPOSITORY" 2>/dev/null && \
                gh pr edit "$PR_NUMBER" --add-label "review-auto-retry" 2>/dev/null || true
              gh workflow run review-pr.yml -f pr_number="$PR_NUMBER" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
              gh pr comment "$PR_NUMBER" --body "⚠️ **Codex Review — crashed, auto-retrying**

          The review workflow hit an error and has been re-queued automatically." 2>/dev/null || true
            else
              gh pr edit "$PR_NUMBER" --remove-label "review-auto-retry" 2>/dev/null || true
              gh pr comment "$PR_NUMBER" --body "❌ **Codex Review — failed after auto-retry**

          👋 @$REVIEWER — automated review failed twice. Please review this PR manually." 2>/dev/null || true
              gh pr edit "$PR_NUMBER" --add-reviewer "$REVIEWER" 2>/dev/null || true
            fi
          fi' EXIT

          ROUND=0
          VERDICT="FAIL"

          while [ "$VERDICT" = "FAIL" ] && [ "$ROUND" -lt "$MAX_REVIEW_ROUNDS" ]; do
            ROUND=$((ROUND + 1))
            echo "=== Review round $ROUND ==="

            git diff "origin/$BASE_BRANCH"..."$PR_BRANCH" | head -c 100000 > /tmp/pr.diff

            rm -f /tmp/review.md
            retry 3 codex exec review \
              --full-auto \
              -m "$CODEX_MODEL" \
              --base "origin/$BASE_BRANCH" \
              -o /tmp/review.md \
              "Review for correctness, security, edge cases, and code style. End your response with VERDICT:PASS or VERDICT:FAIL on the last line."
            git checkout -- . 2>/dev/null || true

            VERDICT=$(grep -oP 'VERDICT:\K(PASS|FAIL)' /tmp/review.md | tail -1 || echo "FAIL")
            REVIEW_BODY=$(sed '/VERDICT:/d' /tmp/review.md)
            echo "Verdict: $VERDICT"

            if [ "$VERDICT" = "FAIL" ] && [ "$ROUND" -lt "$MAX_REVIEW_ROUNDS" ]; then
              echo "=== Applying fixes (round $ROUND) ==="

              FIX_PROMPT="You are fixing code review issues in the jobseek project on branch $PR_BRANCH.

              The reviewer found these issues:
              $REVIEW_BODY

              Fix all of them. Commit your changes and push: git push origin $PR_BRANCH
              Do not open a new PR — one already exists."

              retry 3 codex exec --full-auto -m "$CODEX_MODEL" "$FIX_PROMPT"

              gh pr comment "$PR_NUMBER" --body "🔧 **Codex applied fixes (round $ROUND)**

              Issues found:
              $REVIEW_BODY

              Re-reviewing..."

            fi
          done

          # Disarm the trap — we're exiting cleanly after posting the final review
          trap - EXIT

          # Post final review
          if [ "$VERDICT" = "PASS" ]; then
            gh pr comment "$PR_NUMBER" --body "✅ **Codex Review — PASSED** (${ROUND} round(s))

          $REVIEW_BODY

          ---
          👋 @$REVIEWER — this PR passed automated review and is ready for your final look."
            gh pr edit "$PR_NUMBER" --add-reviewer "$REVIEWER" 2>/dev/null || true
          else
            gh pr comment "$PR_NUMBER" --body "⚠️ **Codex Review — needs attention** (${MAX_REVIEW_ROUNDS} rounds exhausted)

          $REVIEW_BODY

          ---
          👋 @$REVIEWER — automated fixes were attempted but issues remain. Please review manually."
            gh pr edit "$PR_NUMBER" --add-reviewer "$REVIEWER" 2>/dev/null || true
          fi
