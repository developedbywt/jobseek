name: Implement feature task

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: implement-feature
  cancel-in-progress: false

env:
  BUDGET_PER_3H: 3
  MAX_REVIEW_ROUNDS: 2
  CODEX_MODEL: gpt-5.5-2026-04-23
  REVIEWER: Milky-Mac

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  implement:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_FEATURE_IMPLEMENTER != 'false' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$OPENAI_KEY" ] && [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::Neither OPENAI_API_KEY nor CLAUDE_ACCESS_TOKEN is set — skipping."
            exit 1
          fi
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_ACCESS_TOKEN }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0

      - name: Select issue
        id: select
        run: .github/scripts/select-feature-issue.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      - name: Check budget
        id: budget
        if: steps.select.outputs.selected != ''
        run: .github/scripts/check-feature-budget.sh
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_PER_3H: ${{ env.BUDGET_PER_3H }}

      - name: Setup Node.js
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install agents
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Build implementation context
        id: context
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        run: |
          ISSUE_NUM="${{ steps.select.outputs.selected }}"
          REPO="${{ github.repository }}"

          ISSUE_BODY=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.body')
          PARENT_NUM=$(echo "$ISSUE_BODY" | grep -oP '(?<=Parent: #)\d+' | head -1)
          ISSUE_TITLE=$(gh api "repos/$REPO/issues/$ISSUE_NUM" --jq '.title')

          if [ -n "$PARENT_NUM" ]; then
            PARENT_BODY=$(gh api "repos/$REPO/issues/$PARENT_NUM" --jq '.body')
          else
            PARENT_BODY="(no parent issue found)"
          fi

          SLUG=$(echo "$ISSUE_TITLE" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g' | sed 's/-\+/-/g' | sed 's/^-\|-$//g' | cut -c1-50)
          BRANCH="feat/${SLUG}-issue-${ISSUE_NUM}"

          echo "issue_num=$ISSUE_NUM" >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "issue_title=$ISSUE_TITLE" >> "$GITHUB_OUTPUT"

          # Write task context to files (avoids GITHUB_ENV size limits)
          echo "$ISSUE_BODY" > /tmp/task_body.md
          echo "$PARENT_BODY" > /tmp/parent_spec.md
        env:
          GH_TOKEN: ${{ github.token }}

      # --- Codex path: implement → review → fix loop → PR → notify ---
      - name: Implement, review and ship (Codex)
        id: codex_pipeline
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0 &&
          env.OPENAI_API_KEY != ''
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUM: ${{ steps.select.outputs.selected }}
          BRANCH: ${{ steps.context.outputs.branch }}
          ISSUE_TITLE: ${{ steps.context.outputs.issue_title }}
          CODEX_MODEL: ${{ env.CODEX_MODEL }}
          MAX_REVIEW_ROUNDS: ${{ env.MAX_REVIEW_ROUNDS }}
          REVIEWER: ${{ env.REVIEWER }}
        run: |
          set -e

          git config user.email "actions@github.com"
          git config user.name "GitHub Actions"

          # Retry helper — for transient errors (network, rate limit) only
          retry() {
            local max=$1; shift
            local attempt=0
            until "$@"; do
              attempt=$((attempt + 1))
              [ "$attempt" -ge "$max" ] && return 1
              echo "Attempt $attempt failed — retrying in $((attempt * 30))s..."
              sleep $((attempt * 30))
            done
          }

          IMPLEMENT_PROMPT="You are implementing a feature task for the jobseek project.

          ## Parent Feature Spec
          $(cat /tmp/parent_spec.md)

          ## Task to Implement
          $(cat /tmp/task_body.md)

          ## Instructions
          1. Create and switch to branch: git checkout -b $BRANCH
          2. Implement the task. Follow existing code conventions in the repo.
          3. Write or update tests if the task involves logic changes.
          4. Commit your changes with a concise commit message.
          5. Push the branch: git push origin $BRANCH
          6. Do NOT open a PR — the pipeline will do that after review."

          # ── Resume detection ──────────────────────────────────────────────
          COMMITS_ON_BRANCH=0
          if git ls-remote --heads origin "$BRANCH" | grep -q .; then
            git fetch origin "$BRANCH":"$BRANCH" 2>/dev/null || true
            COMMITS_ON_BRANCH=$(git log origin/main.."$BRANCH" --oneline 2>/dev/null | wc -l | tr -d ' ' || echo 0)
          fi

          if [ "$COMMITS_ON_BRANCH" -gt 0 ]; then
            echo "=== Branch $BRANCH has $COMMITS_ON_BRANCH commit(s) ahead of main — resuming from review phase ==="
            git checkout "$BRANCH"
          else
            echo "=== Step 1: Implement ==="
            retry 3 codex exec --full-auto -m "$CODEX_MODEL" "$IMPLEMENT_PROMPT"
            git checkout "$BRANCH" 2>/dev/null || true
          fi

          # ── PR-exists check — skip creation if already open ───────────────
          EXISTING_PR=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -n "$EXISTING_PR" ]; then
            echo "=== PR #$EXISTING_PR already exists — notifying reviewer and exiting ==="
            gh pr edit "$EXISTING_PR" --add-reviewer "$REVIEWER" 2>/dev/null || true
            gh pr comment "$EXISTING_PR" --body "👋 @$REVIEWER — resumed after a previous run. PR is ready for your review."
            exit 0
          fi

          ROUND=0
          VERDICT="FAIL"

          while [ "$VERDICT" = "FAIL" ] && [ "$ROUND" -lt "$MAX_REVIEW_ROUNDS" ]; do
            ROUND=$((ROUND + 1))
            echo "=== Step 2: Review (round $ROUND) ==="

            git diff origin/main..."$BRANCH" | head -c 100000 > /tmp/pr.diff

            rm -f /tmp/review.md
            retry 3 codex exec review \
              --full-auto \
              -m "$CODEX_MODEL" \
              --base "origin/main" \
              -o /tmp/review.md \
              "Review for correctness, security, edge cases, and code style. End with VERDICT:PASS or VERDICT:FAIL on the last line."
            git checkout -- . 2>/dev/null || true

            VERDICT=$(grep -oP 'VERDICT:\K(PASS|FAIL)' /tmp/review.md | tail -1 || echo "FAIL")
            echo "Review verdict: $VERDICT"

            if [ "$VERDICT" = "FAIL" ] && [ "$ROUND" -lt "$MAX_REVIEW_ROUNDS" ]; then
              echo "=== Step 3: Fix issues (round $ROUND) ==="
              ISSUES=$(sed '/VERDICT:/d' /tmp/review.md)

              FIX_PROMPT="You are fixing review issues in the jobseek project on branch $BRANCH.

              The code reviewer found these issues:
              $ISSUES

              Fix all of them. Commit the fixes and push: git push origin $BRANCH.
              Do not open a PR."

              retry 3 codex exec --full-auto -m "$CODEX_MODEL" "$FIX_PROMPT"
              git checkout "$BRANCH" 2>/dev/null || true
            fi
          done

          echo "=== Step 4: Create PR ==="
          REVIEW_BODY=$(sed '/VERDICT:/d' /tmp/review.md || echo "")

          PR_URL=$(gh pr create \
            --title "$ISSUE_TITLE" \
            --body "Closes #$ISSUE_NUM

          ---
          🤖 Implemented and reviewed autonomously.

          **Codex review summary:**
          $REVIEW_BODY" \
            --head "$BRANCH" \
            --base main)

          echo "PR created: $PR_URL"
          PR_NUMBER=$(echo "$PR_URL" | grep -oP '\d+$')

          echo "=== Step 5: Notify reviewer ==="
          gh issue edit "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --remove-label "in-progress" --add-label "awaiting-review" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-reviewer "$REVIEWER" 2>/dev/null || true
          gh pr comment "$PR_NUMBER" --body "👋 @$REVIEWER — implementation is done and passed Codex review (${ROUND} round(s)). Ready for your final review."

      # --- Claude fallback: implement + PR directly (no review loop) ---
      - name: Implement (Claude Code fallback)
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0 &&
          steps.codex_pipeline.outcome != 'success'
        uses: grll/claude-code-action@beta
        with:
          direct_prompt: |
            You are implementing a feature task for the jobseek project.

            ## Parent Feature Spec
            ${{ hashFiles('/tmp/parent_spec.md') != '' && '(see /tmp/parent_spec.md)' || '(no parent issue found)' }}

            ## Task
            Issue #${{ steps.select.outputs.selected }}: ${{ steps.context.outputs.issue_title }}

            ## Instructions
            1. Create branch: git checkout -b ${{ steps.context.outputs.branch }}
            2. Implement the task. Follow existing code conventions.
            3. Write or update tests if the task involves logic changes.
            4. Open a PR titled "${{ steps.context.outputs.issue_title }}" with body: Closes #${{ steps.select.outputs.selected }}
            5. Assign @${{ env.REVIEWER }} as reviewer and comment: "👋 @${{ env.REVIEWER }} — ready for your review."
          use_oauth: "true"
          claude_access_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          claude_refresh_token: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          claude_expires_at: ${{ secrets.CLAUDE_EXPIRES_AT }}
          secrets_admin_pat: ${{ secrets.SECRETS_ADMIN_PAT }}

      - name: Reset label on failure
        if: >
          (failure() || cancelled()) &&
          steps.select.outputs.selected != ''
        run: |
          ISSUE_NUM="${{ steps.select.outputs.selected }}"
          gh issue edit "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --remove-label "in-progress" --add-label "implement-me" 2>/dev/null || true
          gh issue comment "$ISSUE_NUM" --repo "${{ github.repository }}" \
            --body "<!-- feat-failed --> :x: Implementation run failed or timed out. Reset to \`implement-me\` for retry on next cron tick." 2>/dev/null || true
        env:
          GH_TOKEN: ${{ github.token }}
