name: Resolve company requests

on:
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

concurrency:
  group: resolve-company-requests
  cancel-in-progress: false

env:
  BUDGET_PER_5H: 5

permissions:
  contents: write       # push add-company/* branches
  pull-requests: write  # create/update draft PRs, post comments
  issues: write         # comment on issues, add labels, close

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: ${{ vars.ENABLE_COMPANY_RESOLVER != 'false' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$OPENAI_KEY" ] && [ -z "$CLAUDE_TOKEN" ]; then
            echo "::error::Neither OPENAI_API_KEY nor CLAUDE_ACCESS_TOKEN is set — skipping."
            exit 1
          fi
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_TOKEN: ${{ secrets.CLAUDE_ACCESS_TOKEN }}

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Select issue
        id: select
        run: .github/scripts/select-issue.sh
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}

      - name: Check budget
        id: budget
        if: steps.select.outputs.selected != ''
        run: .github/scripts/check-budget.sh
        env:
          GH_TOKEN: ${{ github.token }}
          BUDGET_PER_5H: ${{ env.BUDGET_PER_5H }}

      - name: Setup Node.js
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install agents
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        run: npm install -g @anthropic-ai/claude-code @openai/codex

      - name: Setup Python and crawler deps
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        run: |
          pip install uv
          cd apps/crawler && uv sync

      - name: Build resolve context
        if: steps.select.outputs.selected != ''
        run: |
          {
            echo 'AGENT_PROMPT<<AGENT_PROMPT_EOF'
            echo "Run: ws task --issue ${{ steps.select.outputs.selected }}"
            echo ""
            echo "Follow the instructions printed by ws task. The ws tool will guide"
            echo "you through the parallel pipeline: pre-verify, create workspace,"
            echo "spawn subagents for enrichment/logos/boards, test configs, submit."
            echo ""
            echo "Only process this ONE issue. Do not process any others."
            echo 'AGENT_PROMPT_EOF'
          } >> "$GITHUB_ENV"

      - name: Run Codex
        id: codex_run
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ] || ! command -v codex &>/dev/null; then
            echo "Codex not available — skipping."
            exit 1
          fi
          cd apps/crawler
          codex --approval-mode full-auto "$AGENT_PROMPT"

      - name: Run Claude Code (fallback)
        if: >
          steps.select.outputs.selected != '' &&
          steps.budget.outputs.remaining > 0 &&
          steps.codex_run.outcome != 'success'
        uses: grll/claude-code-action@beta
        with:
          direct_prompt: ${{ env.AGENT_PROMPT }}
          use_oauth: "true"
          claude_access_token: ${{ secrets.CLAUDE_ACCESS_TOKEN }}
          claude_refresh_token: ${{ secrets.CLAUDE_REFRESH_TOKEN }}
          claude_expires_at: ${{ secrets.CLAUDE_EXPIRES_AT }}
          secrets_admin_pat: ${{ secrets.SECRETS_ADMIN_PAT }}
